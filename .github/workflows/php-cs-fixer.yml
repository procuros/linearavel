name: Code Style

on: [ pull_request, push ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    name: Run code style checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, iconv

      - name: Register composer cache directory
        id: composer-cache-files-dir
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ${{ steps.composer-cache-files-dir.outputs.dir }}
          key: ${{ runner.os }}-php-cs-fixer-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-cs-fixer-composer-

      - name: Install dependencies
        env:
          COMPOSER_DISCARD_CHANGES: true
        run: composer require --no-progress --no-interaction --prefer-dist --update-with-all-dependencies "laravel/framework:12.*" "orchestra/testbench:10.*"

      - name: Run PHP CS Fixer
        run: ./vendor/bin/php-cs-fixer fix --diff --dry-run
